[project]
name = "pm-sidecar"
version = "0.0.1"
description = "pro_manage Python sidecar: render, spreadsheets, derived metrics (FSD §05)."
readme = "README.md"
requires-python = ">=3.14"
license = "MIT"
dependencies = [
  "grpcio>=1.76",
  "grpcio-health-checking>=1.76",
  "protobuf>=6.31",
]

[dependency-groups]
dev = [
  "pytest>=8.4",
  "ruff>=0.14",
  "mypy>=1.18",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pm_sidecar"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.mypy]
python_version = "3.14"
strict = true
ignore_missing_imports = true
