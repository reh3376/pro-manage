# Dedicated MDEMG stack for pro_manage development (FSD §06, decided 2026-10-20).
#
# Separate from the owner's own MDEMG instances: its own Neo4j and TimescaleDB,
# the server pinned by tag and digest, sharing only the workstation's local
# inference servers (llama-server :8102 for the LLM, Ollama :11434 for
# embeddings) through host.docker.internal. Nothing leaves the machine.
#
#   make mdemg-up / make mdemg-down / make mdemg-logs
name: pro-manage-mdemg

x-mdemg-version: &mdemg-image ghcr.io/reh3376/mdemg:v0.11.0-beta.3@sha256:ac50c280a001c247f4328d43b9bd78a149af2e1ab2a6ab201c3e65e362ce40f4
x-sidecar-version: &sidecar-image ghcr.io/reh3376/mdemg-neural-sidecar:v0.11.0-beta.3@sha256:2685587cd841487060c0f1f98ca97490572171e20e6b621f88ab7360001de39f

services:
  mdemg:
    image: *mdemg-image
    restart: unless-stopped
    ports:
      - "127.0.0.1:${PM_MDEMG_PORT:-9998}:9999"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      LISTEN_ADDR: ":9999"
      LOG_FORMAT: json
      LOG_SKIP_HEALTH: "true"

      # Graph + metrics stores (this stack's own)
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASS: ${MDEMG_NEO4J_PASS:?set MDEMG_NEO4J_PASS}
      TSDB_HOST: timescaledb
      TSDB_PORT: "5432"
      TSDB_USER: mdemg
      TSDB_PASSWORD: ${MDEMG_TSDB_PASSWORD:?set MDEMG_TSDB_PASSWORD}
      TSDB_DATABASE: mdemg_metrics
      TSDB_ENABLED: "true"
      TSDB_AUTO_MIGRATE: "true"
      TSDB_OPTIONAL: "true"
      AUTO_MIGRATE: "true"

      # Authentication: pm-core presents X-API-Key (FSD §06 secrets)
      AUTH_ENABLED: "true"
      AUTH_MODE: apikey
      AUTH_API_KEYS: ${MDEMG_API_KEY:?set MDEMG_API_KEY}
      J17_TICKET_SECRET: ${MDEMG_J17_TICKET_SECRET:?set MDEMG_J17_TICKET_SECRET}

      # Local inference only (FSD §06 "Language model and data boundary")
      LLM_PROVIDER: openai            # the OpenAI-compatible protocol, served locally
      LLM_ENDPOINT: ${MDEMG_LLM_ENDPOINT:-http://host.docker.internal:8102/v1}
      LLM_MODEL: ${MDEMG_LLM_MODEL:-mdemg-llm-v1}
      LLM_WATCHDOG_ENABLED: "true"
      EMBEDDING_PROVIDER: ollama
      OLLAMA_ENDPOINT: ${MDEMG_OLLAMA_ENDPOINT:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${MDEMG_EMBED_MODEL:-nomic-embed-text}
      RERANK_ENABLED: "true"
      RERANK_PROVIDER: openai         # same local endpoint
      RERANK_MODEL: ${MDEMG_LLM_MODEL:-mdemg-llm-v1}
      J17_SIDECAR_URL: http://neural-sidecar:8000
      J17_SIDECAR_MODE: shadow

      # Jiminy per FSD §06 decisions
      JIMINY_ENABLED: "true"
      JIMINY_TRUST_MODE: ema
      JIMINY_SYNTHESIS_ENABLED: "true"
      JIMINY_EVALUATE_ENABLED: "true"
      JIMINY_EVALUATE_LLM_ENABLED: "true"
      JIMINY_OUTCOME_CLASSIFIER_ENABLED: "true"
      METALEARN_ENABLED: "false"      # no cross-space promotion
      EMERGENCE_ENABLED: "false"
      INTENT_ENABLED: "false"

      # Operational
      METRICS_ENABLED: "true"
      METRICS_NAMESPACE: mdemg
      RATE_LIMIT_ENABLED: "true"
      CIRCUIT_BREAKER_ENABLED: "true"
      LLM_INTERACTION_LOGGING: "true"
      GRACEFUL_SHUTDOWN_TIMEOUT: "30"
    stop_grace_period: 35s
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:9999/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    depends_on:
      neo4j:
        condition: service_healthy
      timescaledb:
        condition: service_healthy

  neo4j:
    image: neo4j:5
    restart: unless-stopped
    ports:
      - "127.0.0.1:${PM_MDEMG_NEO4J_HTTP_PORT:-7476}:7474"
      - "127.0.0.1:${PM_MDEMG_NEO4J_BOLT_PORT:-7689}:7687"
    environment:
      NEO4J_AUTH: neo4j/${MDEMG_NEO4J_PASS}
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_dbms_memory_pagecache_size: 512M
      NEO4J_dbms_memory_heap_initial__size: 256M
      NEO4J_dbms_memory_heap_max__size: 1G
      NEO4J_dbms_security_procedures_unrestricted: apoc.*
      NEO4J_dbms_security_procedures_allowlist: apoc.*
    volumes:
      - pm_mdemg_neo4j_data:/data
      - pm_mdemg_neo4j_logs:/logs
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p ${MDEMG_NEO4J_PASS} 'RETURN 1'"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  timescaledb:
    image: timescale/timescaledb:2.25.1-pg16
    restart: unless-stopped
    ports:
      - "127.0.0.1:${PM_MDEMG_TSDB_PORT:-5435}:5432"
    environment:
      POSTGRES_DB: mdemg_metrics
      POSTGRES_USER: mdemg
      POSTGRES_PASSWORD: ${MDEMG_TSDB_PASSWORD}
    volumes:
      - pm_mdemg_tsdb:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mdemg -d mdemg_metrics"]
      interval: 10s
      timeout: 5s
      retries: 10

  neural-sidecar:
    image: *sidecar-image
    restart: unless-stopped
    ports:
      - "127.0.0.1:${PM_MDEMG_SIDECAR_PORT:-8103}:8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

volumes:
  pm_mdemg_neo4j_data:
  pm_mdemg_neo4j_logs:
  pm_mdemg_tsdb:
