# pro_manage development stack (FSD §05 "local dev", roadmap Phase 0).
#
#   make dev        # everything below against the dedicated MDEMG stack (docker-compose.mdemg.yml)
#   make dev-stub   # same, but with the stub MDEMG (what PR CI runs)
#
# Host ports are chosen to avoid the owner's existing MDEMG stacks
# (5432..5434, 7474..7475, 7687..7688, 8100..8102, 9999, 3000, 3002).
name: pro-manage

x-pm-env: &pm-env
  PM_LOG_FORMAT: ${PM_LOG_FORMAT:-json}
  PM_LOG_LEVEL: ${PM_LOG_LEVEL:-info}
  MDEMG_BASE_URL: ${MDEMG_BASE_URL:-http://host.docker.internal:9998}
  MDEMG_API_KEY: ${MDEMG_API_KEY:?set MDEMG_API_KEY in deploy/compose/.env}
  DATABASE_URL: postgres://pm:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/pm_core?sslmode=disable
  TSDB_URL: postgres://pm:${POSTGRES_PASSWORD}@tsdb:5432/pm_tsdb?sslmode=disable
  REDIS_URL: redis://redis:6379/0
  S3_ENDPOINT: http://rustfs:9000
  S3_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:-rustfsadmin}
  S3_SECRET_KEY: ${RUSTFS_SECRET_KEY:-rustfsadmin}
  S3_BUCKET: pm-dev
  # Keycloak advertises KC_HOSTNAME (the browser-facing URL) as its issuer; in-network calls go through the backchannel.
  OIDC_ISSUER: http://localhost:${PM_KEYCLOAK_PORT:-8180}/realms/northfield
  OIDC_DISCOVERY_URL: http://keycloak:8080/realms/northfield/.well-known/openid-configuration
  OIDC_BACKCHANNEL_BASE: http://keycloak:8080
  IDPI_OIDC_ADDR: idpi-oidc:7080
  SIGI_ADDR: sigi-stub:7090
  SIGI_PROVIDER: stub
  COMMSI_ADDR: commsi-smtp:7100
  PM_NOTIFY_FALLBACK_DOMAIN: northfield.example   # dev-header actors have no users row; Mailpit catches everything
  # Browser-facing URLs for the login flow (callback base and return_to). Override in .env when
  # localhost is taken on the workstation (e.g. another service on [::1]:8080): PM_PUBLIC_URL=http://127.0.0.1:8080.
  PM_PUBLIC_URL: ${PM_PUBLIC_URL:-http://localhost:${PM_CORE_PORT:-8080}}
  PM_FRONTEND_URL: ${PM_FRONTEND_URL:-http://localhost:${PM_FRONTEND_PORT:-3100}}
  SMTP_HOST: mailpit
  SMTP_PORT: "1025"
  PM_DB_AUTO_MIGRATE: ${PM_DB_AUTO_MIGRATE:-true}
  PM_DEV_ACTOR_HEADER: ${PM_DEV_ACTOR_HEADER:-true}
  AUDIT_CHAIN_KEY: ${AUDIT_CHAIN_KEY:?set AUDIT_CHAIN_KEY in deploy/compose/.env (openssl rand -hex 32)}
  PM_CORE_GRPC_REFLECTION: ${PM_CORE_GRPC_REFLECTION:-true}

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: pm
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: pm_core
    ports:
      - "127.0.0.1:${PM_POSTGRES_PORT:-5440}:5432"
    volumes:
      - pm_postgres:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pm -d pm_core"]
      interval: 5s
      timeout: 5s
      retries: 12

  tsdb:
    image: timescale/timescaledb:2.30.2-pg16
    environment:
      POSTGRES_USER: pm
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: pm_tsdb
    ports:
      - "127.0.0.1:${PM_TSDB_PORT:-5441}:5432"
    volumes:
      - pm_tsdb:/var/lib/postgresql/data
      - ./tsdb/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pm -d pm_tsdb"]
      interval: 5s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "127.0.0.1:${PM_REDIS_PORT:-6380}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  rustfs:
    # S3-compatible object store for dev (FSD §05 "MinIO or equivalent"; MinIO images are no longer published).
    image: rustfs/rustfs:1.0.3
    environment:
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: 0.0.0.0:9000
      RUSTFS_CONSOLE_ADDRESS: 0.0.0.0:9001
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:-rustfsadmin}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY:-rustfsadmin}
      RUSTFS_OBS_LOGGER_LEVEL: warn
    ports:
      - "127.0.0.1:${PM_S3_PORT:-9100}:9000"
      - "127.0.0.1:${PM_S3_CONSOLE_PORT:-9101}:9001"
    volumes:
      - pm_rustfs:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:9000/health/live || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12

  keycloak:
    image: quay.io/keycloak/keycloak:26.8
    command: ["start-dev", "--import-realm", "--health-enabled=true"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_ADMIN_USER:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_ADMIN_PASSWORD:?set KC_ADMIN_PASSWORD}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: pm
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD}
      KC_HTTP_ENABLED: "true"
      KC_HOSTNAME: http://localhost:${PM_KEYCLOAK_PORT:-8180}
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
    ports:
      - "127.0.0.1:${PM_KEYCLOAK_PORT:-8180}:8080"
    volumes:
      - ./keycloak:/opt/keycloak/data/import:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      # The image has no curl/wget; bash /dev/tcp against the management port (9000) health endpoint.
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q '\"status\": \"UP\"' <&3"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 40s

  mailpit:
    image: axllent/mailpit:v1.31
    ports:
      - "127.0.0.1:${PM_MAILPIT_UI_PORT:-8026}:8025"
      - "127.0.0.1:${PM_SMTP_PORT:-1026}:1025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 10s
      timeout: 5s
      retries: 6

  stub-mdemg:
    # PR CI's stand-in for MDEMG (FSD §06). `make dev-stub` enables it; `make dev` does not.
    profiles: ["stub"]
    build:
      context: ../../services/pm-core
      args:
        CMD: stub-mdemg
        VERSION: ${PM_VERSION:-dev}
    environment:
      PM_LOG_FORMAT: ${PM_LOG_FORMAT:-json}
      STUB_API_KEY: ${MDEMG_API_KEY}
    ports:
      - "127.0.0.1:${PM_STUB_MDEMG_PORT:-9997}:9999"
    # No container healthcheck: the image is distroless (no shell); scripts/smoke.sh probes /healthz from the host.

  pm-core:
    build:
      context: ../../services/pm-core
      args:
        CMD: pm-core
        VERSION: ${PM_VERSION:-dev}
    environment:
      <<: *pm-env
    ports:
      - "127.0.0.1:${PM_CORE_PORT:-8080}:8080"
      - "127.0.0.1:${PM_CORE_GRPC_PORT:-8090}:8090"
    depends_on:
      postgres:
        condition: service_healthy
      tsdb:
        condition: service_healthy
      redis:
        condition: service_healthy
      rustfs:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"

  pm-workers:
    build:
      context: ../../services/pm-core
      args:
        CMD: pm-workers
        VERSION: ${PM_VERSION:-dev}
    environment:
      <<: *pm-env
      PM_WORKERS_TICK: ${PM_WORKERS_TICK:-30s}
    ports:
      - "127.0.0.1:${PM_WORKERS_PORT:-8081}:8081"
    depends_on:
      postgres:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"

  pm-sidecar:
    build:
      context: ../../services/pm-sidecar
    environment:
      PM_LOG_LEVEL: ${PM_LOG_LEVEL:-info}
    ports:
      - "127.0.0.1:${PM_SIDECAR_HTTP_PORT:-7070}:7070"
      - "127.0.0.1:${PM_SIDECAR_GRPC_PORT:-7071}:7071"

  idpi-oidc:
    # IdPi_OIDC connector module (FSD §04, §10, §15): built from the repository root because the
    # contract's generated code lives in the pm-core module until the Connector SDK exists.
    build:
      context: ../..
      dockerfile: connectors/idpi/oidc/Dockerfile
      args:
        VERSION: ${PM_VERSION:-dev}
    environment:
      PM_LOG_FORMAT: ${PM_LOG_FORMAT:-json}
      PM_LOG_LEVEL: ${PM_LOG_LEVEL:-info}
      OIDC_ISSUER: http://localhost:${PM_KEYCLOAK_PORT:-8180}/realms/northfield
      OIDC_DISCOVERY_URL: http://keycloak:8080/realms/northfield/.well-known/openid-configuration
      OIDC_BACKCHANNEL_BASE: http://keycloak:8080
      OIDC_CLIENT_ID: pm-core
      OIDC_CLIENT_SECRET: ${PM_CORE_OIDC_SECRET:-pm-core-dev-secret}
      OIDC_ACCEPTED_AUDIENCES: pm-frontend,pm-dev-cli
      OIDC_SCOPES: openid   # the dev realm's partial import has no profile/email scopes; the pro_manage scope is default
      IDPI_GRPC_REFLECTION: ${PM_CORE_GRPC_REFLECTION:-true}
    ports:
      - "127.0.0.1:${PM_IDPI_GRPC_PORT:-7080}:7080"
      - "127.0.0.1:${PM_IDPI_HTTP_PORT:-7081}:7081"
    depends_on:
      - keycloak

  sigi-stub:
    # Sigi_STUB connector module (FSD §10): the development and CI e-signature backend. Envelopes live in
    # memory; POST /dev/envelopes/{id}/sign on :7091 stands in for a signer; the signed artifact is a real PDF.
    build:
      context: ../..
      dockerfile: connectors/sigi/stub/Dockerfile
      args:
        VERSION: ${PM_VERSION:-dev}
    environment:
      PM_LOG_FORMAT: ${PM_LOG_FORMAT:-json}
      SIGI_WEBHOOK_SECRET: ${SIGI_WEBHOOK_SECRET:-stub-webhook-secret}
      SIGI_GRPC_REFLECTION: ${PM_CORE_GRPC_REFLECTION:-true}
    ports:
      - "127.0.0.1:${PM_SIGI_GRPC_PORT:-7090}:7090"
      - "127.0.0.1:${PM_SIGI_HTTP_PORT:-7091}:7091"

  commsi-smtp:
    # Commsi_SMTP connector module (FSD §10): pm-core's notifications as email, into Mailpit (UI on :8026).
    build:
      context: ../..
      dockerfile: connectors/commsi/smtp/Dockerfile
      args:
        VERSION: ${PM_VERSION:-dev}
    environment:
      PM_LOG_FORMAT: ${PM_LOG_FORMAT:-json}
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      SMTP_STARTTLS: "false"
      COMMSI_FROM: "pro_manage <no-reply@northfield.example>"
      COMMSI_DEDUPE_WINDOW: ${COMMSI_DEDUPE_WINDOW:-10m}
      PM_FRONTEND_URL: ${PM_FRONTEND_URL:-http://localhost:${PM_FRONTEND_PORT:-3100}}
      COMMSI_GRPC_REFLECTION: ${PM_CORE_GRPC_REFLECTION:-true}
    ports:
      - "127.0.0.1:${PM_COMMSI_GRPC_PORT:-7100}:7100"
      - "127.0.0.1:${PM_COMMSI_HTTP_PORT:-7101}:7101"
    depends_on:
      - mailpit

  pm-frontend:
    build:
      context: ../../apps/pm-frontend
    environment:
      PM_CORE_URL: http://pm-core:8080
      PM_WORKERS_URL: http://pm-workers:8081
      PM_SIDECAR_URL: http://pm-sidecar:7070
      PM_CORE_PUBLIC_URL: ${PM_PUBLIC_URL:-http://localhost:${PM_CORE_PORT:-8080}}
      PM_FRONTEND_URL: ${PM_FRONTEND_URL:-http://localhost:${PM_FRONTEND_PORT:-3100}}
      PM_VERSION: ${PM_VERSION:-dev}
    ports:
      - "127.0.0.1:${PM_FRONTEND_PORT:-3100}:3100"
    depends_on:
      - pm-core

volumes:
  pm_postgres:
  pm_tsdb:
  pm_rustfs:
