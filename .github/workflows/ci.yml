# PR CI for pro_manage. Every job is merge-blocking; no test step may carry
# continue-on-error (FSD §12). Third-party actions are pinned to commit SHAs
# (backlog B-01); Dependabot keeps the pins current. The compose smoke runs against the stub MDEMG
# because CI cannot run the local model; live UATS against the pinned MDEMG
# is a local pre-merge step (`make test-uats-live`, arriving with slice 0b).
name: ci

# Runs on every push (the PR is opened by github-actions[bot], whose
# pull_request runs would otherwise wait for manual approval) and on
# pull_request events. Checks attach to the commit, so the PR shows them.
on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  go:
    name: Go (pm-core, pm-workers, stub-mdemg, IdPi_OIDC, Sigi_STUB)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/pm-core
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: services/pm-core/go.mod
          cache-dependency-path: |
            services/pm-core/go.sum
            connectors/idpi/oidc/go.sum
            connectors/sigi/stub/go.sum
      - run: go mod verify
      - run: go build ./...
      - run: go vet ./...
      - run: go test -race -count=1 ./...
      - name: IdPi_OIDC connector module
        working-directory: connectors/idpi/oidc
        run: |
          go mod verify
          go build ./...
          go vet ./... && test -z "$(gofmt -l .)"
          go test -race -count=1 ./...
      - name: Sigi_STUB connector module
        working-directory: connectors/sigi/stub
        run: |
          go mod verify
          go build ./...
          go vet ./... && test -z "$(gofmt -l .)"
          go test -race -count=1 ./...

  python:
    name: Python (pm-sidecar)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/pm-sidecar
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true
          cache-dependency-glob: services/pm-sidecar/uv.lock
      - run: uv python install 3.14
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run mypy src
      - run: uv run pytest -q

  frontend:
    name: Frontend (pm-frontend)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/pm-frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: apps/pm-frontend/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/pm-frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

  proto:
    name: Protobuf (buf lint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: bufbuild/buf-action@85aebf73123b5c15fd5528aaecbf9129cddf7fa7 # v1.6.0
        with:
          input: proto
          lint: true
          format: false
          breaking: false
          push: false
          pr_comment: false   # the job has contents:read only; results are in the check, not a comment

  uxts:
    name: UxTS gates (spec hashes, UNTS, inventories, matrix)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0   # matrix currency uses git commit dates
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - run: make test-uxts-hashes
      - run: make test-unts
      - run: make verify-inventories
      - run: make check-matrix

  compose-smoke:
    name: Compose smoke + UATS (stub MDEMG)
    runs-on: ubuntu-latest
    needs: [go, python, frontend]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - name: Build and start the stack
        run: |
          docker compose --env-file deploy/compose/.env.ci \
            -f deploy/compose/docker-compose.dev.yml --profile stub \
            up -d --build
      - name: Smoke
        env:
          MDEMG_API_KEY: ci-stub-key
          SMOKE_TIMEOUT: "240"
        run: scripts/smoke.sh --stub
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: services/pm-core/go.mod
          cache-dependency-path: services/pm-core/go.sum
      - name: Go integration tests (real Postgres from the stack)
        env:
          TEST_DATABASE_URL: postgres://pm:ci-postgres@127.0.0.1:5440/pm_core?sslmode=disable
        run: cd services/pm-core && go test -tags integration -count=1 ./internal/store/
      - name: Go outbox integration tests (Postgres + stub MDEMG)
        env:
          TEST_DATABASE_URL: postgres://pm:ci-postgres@127.0.0.1:5440/pm_core?sslmode=disable
          MDEMG_TEST_URL: http://127.0.0.1:9997
          MDEMG_TEST_KEY: ci-stub-key
        run: cd services/pm-core && go test -tags integration -count=1 ./internal/outbox/
      - name: Seed Northfield dev data
        run: docker compose --env-file deploy/compose/.env.ci -f deploy/compose/docker-compose.dev.yml exec -T postgres psql -v ON_ERROR_STOP=1 -U pm -d pm_core < services/pm-core/db/seeds/northfield.sql
      - name: UATS against the running services
        run: make test-uats
      - name: UDTS gRPC contracts against pm-core
        env:
          UDTS_TARGET: 127.0.0.1:8090
        run: cd services/pm-core && go test -count=1 ./tests/udts/
      - name: UDTS gRPC contracts against IdPi_OIDC (common connector surface + IdPi)
        env:
          UDTS_IDPI_TARGET: 127.0.0.1:7080
        run: cd connectors/idpi/oidc && go test -count=1 ./tests/udts/
      - name: UDTS gRPC contracts against Sigi_STUB
        env:
          UDTS_SIGI_TARGET: 127.0.0.1:7090
        run: cd connectors/sigi/stub && go test -count=1 ./tests/udts/
      - name: Object store and signing integration tests (RustFS + Sigi_STUB + Postgres)
        env:
          TEST_DATABASE_URL: postgres://pm:ci-postgres@127.0.0.1:5440/pm_core?sslmode=disable
          S3_TEST_ENDPOINT: http://127.0.0.1:9100
          SIGI_TEST_ADDR: 127.0.0.1:7090
        run: |
          set -a; source deploy/compose/.env.ci; set +a
          export S3_TEST_ACCESS_KEY="${RUSTFS_ACCESS_KEY:-rustfsadmin}" S3_TEST_SECRET_KEY="${RUSTFS_SECRET_KEY:-rustfsadmin}"
          cd services/pm-core && go test -tags integration -count=1 ./internal/blobs/ ./internal/signing/
      - name: IdPi_OIDC against the dev Keycloak (tokens, claims to roles, refresh, logout)
        env:
          IDPI_TEST_ISSUER: http://127.0.0.1:8180/realms/northfield
        run: cd connectors/idpi/oidc && go test -tags integration -count=1 ./tests/integration/
      - name: SSO login end to end (pm-core -> IdPi_OIDC -> Keycloak login form -> session -> /api/v1 -> logout)
        env:
          PM_CORE_URL: http://127.0.0.1:8080
        run: cd services/pm-core && go test -tags integration -count=1 ./tests/login/
      - name: MDEMG adapter integration tests (against the stub)
        env:
          MDEMG_TEST_URL: http://127.0.0.1:9997
          MDEMG_TEST_KEY: ci-stub-key
        run: cd services/pm-core && go test -tags integration -count=1 ./pkg/mdemgadapter/
      - name: Outbox end to end (pm-core enqueue -> pm-workers drain -> stub MDEMG)
        run: scripts/outbox_check.sh
      - name: CAR domain integration tests (chain, tiers, deny, Tier A refusal; Postgres + stub MDEMG)
        env:
          TEST_DATABASE_URL: postgres://pm:ci-postgres@127.0.0.1:5440/pm_core?sslmode=disable
          MDEMG_TEST_URL: http://127.0.0.1:9997
          MDEMG_TEST_KEY: ci-stub-key
        run: cd services/pm-core && go test -tags integration -count=1 ./internal/domain/
      - name: Toy CAR end to end (Phase 0 exit test through the REST edge)
        run: scripts/car_check.sh
      - name: UATS against the stub MDEMG (MDEMG field-shape pins)
        env:
          MDEMG_API_KEY: ci-stub-key
        run: make test-uats-stub
      - name: Logs on failure
        if: failure()
        run: |
          docker compose --env-file deploy/compose/.env.ci \
            -f deploy/compose/docker-compose.dev.yml --profile stub logs --tail=200
      - name: Tear down
        if: always()
        run: |
          docker compose --env-file deploy/compose/.env.ci \
            -f deploy/compose/docker-compose.dev.yml --profile stub down -v
